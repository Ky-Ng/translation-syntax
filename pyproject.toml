[project]
name = "allegro"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.2",
    "pyyaml>=6.0",
    "wandb>=0.16",
    "nltk>=3.10.3",
    "huggingface-hub>=1.32.0",
    "transformers>=5.17.0",
    "datasets>=5.0.1",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allegro"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
# CUDA wheels only exist for Linux (the cluster); macOS falls back to PyPI (CPU/MPS)
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/*/tests"]

[tool.ruff]
line-length = 120
